name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: build/distributions/*.zip

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: Run checks
        run: ./gradlew check

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: build/reports/tests

  verify:
    name: Verify Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: Run Plugin Verifier
        run: ./gradlew verifyPlugin

      - name: Upload verifier reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier

  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: Run Qodana
        run: ./gradlew qodanaScan --no-configuration-cache --project-cache-dir="$RUNNER_TEMP/qodana-gradle-project-cache"

      - name: Upload Qodana reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: qodana-reports
          path: build/reports/qodana

  workflowTests:
    name: Release workflow regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  runtime:
    name: Real server and instrumentation probes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
      - name: Install pinned native server with intact package layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/effect-tsgo" build/reports/runtime
          npm install --prefix "$RUNNER_TEMP/effect-tsgo" --no-audit --no-fund --no-package-lock @effect/tsgo-linux-x64@0.67.4 2>&1 | tee build/reports/runtime/install.log
          node --version | tee build/reports/runtime/versions.log
          npm list --prefix "$RUNNER_TEMP/effect-tsgo" --depth=0 | tee -a build/reports/runtime/versions.log
      - name: Verify injected instrumentation on Effect 4.1.2
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-instrumentation.mjs --effect 4.1.2 2>&1 | tee build/reports/runtime/instrumentation.log
      - name: Verify all five real LSP lanes
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-real-tsgo-lsp.mjs --binary "$RUNNER_TEMP/effect-tsgo/node_modules/@effect/tsgo-linux-x64/lib/tsc" --only all 2>&1 | tee build/reports/runtime/lsp.log
      - name: Verify diagnostics CLI and LSP rule-name parity
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-tsgo-diagnostics-cli.mjs 2>&1 | tee build/reports/runtime/diagnostics-cli.log
      - name: Upload runtime probe reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-probe-reports
          path: build/reports/runtime

  compatibility:
    name: WebStorm 263 diagnostic compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true
      - run: ./gradlew testIdeVerifierWebStorm
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: compatibility-test-reports
          path: build/reports/tests/testIdeVerifierWebStorm

  releaseDraft:
    name: Release Draft
    if: github.event_name != 'pull_request'
    needs: [build, test, verify, qodana, runtime, compatibility, workflowTests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: Download plugin artifact
        uses: actions/download-artifact@v7
        with:
          name: plugin-distribution
          path: build/distributions

      - name: Create release draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')
          RELEASE_NOTE="./build/tmp/release_note.txt"
          ./gradlew getChangelog --project-version "$VERSION" --no-header --quiet --console=plain --output-file="$RELEASE_NOTE"

          python3 .github/scripts/release-assets.py draft "$VERSION" --notes "$RELEASE_NOTE"
